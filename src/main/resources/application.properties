spring.application.name=Eventify

# 1. Dirección, puerto y nombre de la base de datos MySQL (ej. f1_db)
spring.datasource.url=jdbc:mysql://localhost:3306/venues_and_events_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# 2. Credenciales de acceso a tu servidor MySQL
spring.datasource.username=root
spring.datasource.password=123456

# 3. Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 4. Dialecto de Hibernate para MySQL 8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 5. Configuración del DDL de Hibernate:
# 'update' crea o actualiza las tablas (pilotos, escuderías) automáticamente al arrancar la app.
spring.jpa.hibernate.ddl-auto=update

# 6. Muestra las consultas SQL generadas en la consola (útil durante el desarrollo)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081
